name: Bug report (form)
description: Report something that is not working through a form
body:
  - type: markdown
    attributes:
      value: |
        Welcome! This is a form that allows you to write a bug report through a form rather than manually.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please explain exacly what the bug is and how did you encounter it. You are welcome to add screenshots or videos.
      placeholder: |
        e.g. When I execute a certain function, it doesn't do anyting.
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: |
        e.g. 1.21.4
    validations:
      required: true
  - type: input
    id: datapack_version
    attributes:
      label: Data pack version
      placeholder: |
        e.g. v2.2.0
    validations:
      required: true
assignees: LluisJM
labels: bug
